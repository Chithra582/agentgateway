name: llm-provider-loadbalancer
description: Dispatches inference calls across candidate model providers based on latency, cost, and rate limits.
input_schema:
  type: object
  properties:
    model_name:
      type: string
      description: Requested logical model identifier (e.g., 'gpt-4o', 'claude-3-5-sonnet').
    prompt_payload:
      type: object
      description: OpenAI-compatible chat completion payload.
    timeout_ms:
      type: integer
      description: Request timeout in milliseconds before circuit breaker retry.
      default: 30000
  required:
    - model_name
    - prompt_payload
